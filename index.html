<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Визитка</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 20px;
    }

    .card {
      animation: fadeIn 0.8s ease;
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 40px;
      max-width: 700px;
      margin: 50px auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .links {
      margin-top: 20px;
    }

    .links a,
    #toggle-lang,
    #restart-btn,
    #difficulty {
      display: inline-block;
      background-color: #1e90ff;
      color: white;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      transition: background-color 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .links a:hover,
    #toggle-lang:hover,
    #restart-btn:hover,
    #difficulty:hover {
      background-color: #1565c0;
    }

    @media (max-width: 500px) {
      .card {
        padding: 20px;
        margin: 20px;
        max-width: 90vw;
        box-sizing: border-box;
      }

      .links a,
      #toggle-lang,
      #restart-btn,
      #difficulty {
        display: block;
        width: 100%;
        margin: 10px 0;
        box-sizing: border-box;
        text-align: center;
      }

      #difficulty {
        font-size: 16px;
        padding: 10px;
      }

      .board {
        grid-template-columns: repeat(3, 1fr);
        width: 100%;
      }

      .cell {
        font-size: 40px;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }

    .cell {
      width: 80px;
      height: 80px;
      background-color: #2c2c2c;
      font-size: 36px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .cell:hover {
      background-color: #3c3c3c;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="tim.jpg" alt="Фото" class="avatar" />
    <h1 data-ru="Боровков Тимофей" data-en="Timofey Borovkov">Боровков Тимофей</h1>
    <p class="desc" data-ru="HTML вёрстка" data-en="HTML layout">HTML и CSS вёрстка</p>
    <p data-ru="Обучаюсь в престижном ГАГПК, люблю HTML и CSS." data-en="Studying at prestigious GAGPK, love HTML & CSS.">
      Обучаюсь в престижном ГАГПК, люблю HTML и CSS.
    </p>

    <div class="board" id="board"></div>

    <select id="difficulty">
      <option value="easy">Лёгкий / Easy</option>

      <a href="#" id="toggle-lang"><i class="fas fa-language"></i> English</a>
    </div>
  </div>
