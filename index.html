<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Визитка</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <img src="tim.jpg" alt="Фото" class="avatar" />

    <h1 data-ru="Боровков Тимофей" data-en="Timofey Borovkov">Боровков Тимофей</h1>
    <p class="desc" data-ru="HTML вёрстка" data-en="HTML layout">HTML вёрстка</p>
    <p data-ru="Обучаюсь в престижном ГАГПК, люблю HTML и CSS." 
       data-en="Studying at prestigious GAGPK, love HTML & CSS.">
       Обучаюсь в престижном ГАГПК, люблю HTML и CSS.
    </p>

    <div class="links">
      <a href="https://github.com/MrBell069" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://t.me/bred_04" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
      <a href="#" id="toggle-lang"><i class="fas fa-language"></i> English</a>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-lang');
      let currentLang = 'ru';

      toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();

        currentLang = currentLang === 'ru' ? 'en' : 'ru';

        document.querySelectorAll('[data-ru]').forEach(el => {
          el.textContent = el.dataset[currentLang];
        });

        toggleBtn.innerHTML = currentLang === 'ru' 
          ? '<i class="fas fa-language"></i> English' 
          : '<i class="fas fa-language"></i> Русский';
      });
    });
  </script>
</body>
</html>
