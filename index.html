<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Визитка</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <img src="tim.jpg" alt="Фото" class="avatar" />

    <h1 data-ru="Боровков Тимофей" data-en="Timofey Borovkov">Боровков Тимофей</h1>
    <p class="desc" data-ru="HTML вёрстка" data-en="HTML layout">HTML и CSS вёрстка</p>
    <p data-ru="Обучаюсь в престижном ГАГПК, люблю HTML и CSS." 
       data-en="Studying at prestigious GAGPK, love HTML & CSS.">
       Обучаюсь в престижном ГАГПК, люблю HTML и CSS.
    </p>

    <div class="links">
      <a href="https://github.com/MrBell069" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://t.me/bred_04" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
      <a href="#" id="toggle-lang"><i class="fas fa-language"></i> English</a>
    </div>

    <h2 data-ru="Крестики-нолики" data-en="Tic-Tac-Toe">Крестики-нолики</h2>

    <label for="difficulty" data-ru="Сложность:" data-en="Difficulty:">Сложность:</label>
    <select id="difficulty">
      <option value="easy" data-ru="Лёгкая" data-en="Easy">Лёгкая</option>
      <option value="medium" data-ru="Средняя" data-en="Medium">Средняя</option>
      <option value="hard" data-ru="Сложная" data-en="Hard">Сложная</option>
    </select>

    <div class="board" id="board"></div>
    <p id="status" data-ru="Ты играешь: X" data-en="You play as: X">Ты играешь: X</p>
    <button onclick="restartGame()" id="restart-btn">Сыграть ещё</button>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-lang');
      let currentLang = 'ru';

      toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();

        currentLang = currentLang === 'ru' ? 'en' : 'ru';

        document.querySelectorAll('[data-ru]').forEach(el => {
          el.textContent = el.dataset[currentLang];
        });

        toggleBtn.innerHTML = currentLang === 'ru' 
          ? '<i class="fas fa-language"></i> English' 
          : '<i class="fas fa-language"></i> Русский';
      });

      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status");
      const difficultySelect = document.getElementById("difficulty");

      let board, currentPlayer, gameOver;

      function createBoard() {
        board = Array(9).fill("");
        currentPlayer = "X";
        gameOver = false;
        boardElement.innerHTML = "";
        for (let i = 0; i < 9; i++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.index = i;
          cell.addEventListener("click", handleClick);
          boardElement.appendChild(cell);
        }
        updateStatus();
      }

      function updateStatus() {
        statusElement.textContent = (currentLang === 'ru' ? "Ты играешь: " : "You play as: ") + currentPlayer;
      }

      function handleClick(e) {
        const index = e.target.dataset.index;
        if (gameOver || board[index]) return;
        board[index] = currentPlayer;
        e.target.textContent = currentPlayer;
        if (checkWin(currentPlayer)) {
          statusElement.textContent = (currentLang === 'ru' ? "Победа: " : "Winner: ") + currentPlayer;
          gameOver = true;
          return;
        }
        if (board.every(cell => cell)) {
          statusElement.textContent = currentLang === 'ru' ? "Ничья!" : "Draw!";
          gameOver = true;
          return;
        }
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        updateStatus();
        if (currentPlayer === "O") {
          setTimeout(computerMove, 300);
        }
      }

      function computerMove() {
        let move;
        const diff = difficultySelect.value;
        if (diff === "easy") {
          const empty = board.map((v, i) => v === "" ? i : null).filter(i => i !== null);
          move = empty[Math.floor(Math.random() * empty.length)];
        } else if (diff === "medium") {
          move = getBestMove("O", 1); // 1 уровень глубины
        } else {
          move = getBestMove("O"); // полный minimax
        }
        if (move !== undefined) {
          const cell = boardElement.querySelector(`[data-index="${move}"]`);
          cell.click();
        }
      }

      function getBestMove(player, depthLimit = Infinity) {
        let bestScore = -Infinity;
        let move;
        for (let i = 0; i < 9; i++) {
          if (board[i] === "") {
            board[i] = player;
            const score = minimax(board, 0, false, player, depthLimit);
            board[i] = "";
            if (score > bestScore) {
              bestScore = score;
              move = i;
            }
          }
        }
        return move;
      }

      function minimax(board, depth, isMax, player, depthLimit) {
        const opponent = player === "X" ? "O" : "X";
        if (checkWin(player)) return 10 - depth;
        if (checkWin(opponent)) return depth - 10;
        if (board.every(cell => cell) || depth >= depthLimit) return 0;

        if (isMax) {
          let best = -Infinity;
          for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
              board[i] = player;
              best = Math.max(best, minimax(board, depth + 1, false, player, depthLimit));
              board[i] = "";
            }
          }
          return best;
        } else {
          let best = Infinity;
          for (let i = 0; i < 9; i++) {
            if (board[i] === "") {
              board[i] = opponent;
              best = Math.min(best, minimax(board, depth + 1, true, player, depthLimit));
              board[i] = "";
            }
          }
          return best;
        }
      }

      function checkWin(player) {
        const winCombos = [
          [0,1,2],[3,4,5],[6,7,8],
          [0,3,6],[1,4,7],[2,5,8],
          [0,4,8],[2,4,6]
        ];
        return winCombos.some(combo => combo.every(i => board[i] === player));
      }

      window.restartGame = createBoard;

      createBoard();
    });
  </script>
</body>
</html>
