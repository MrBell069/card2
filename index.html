<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Визитка</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <img src="tim.jpg" alt="Фото" class="avatar" />

    <h1 data-ru="Боровков Тимофей" data-en="Timofey Borovkov">Боровков Тимофей</h1>
    <p class="desc" data-ru="HTML вёрстка" data-en="HTML layout">HTML и CSS вёрстка</p>
    <p data-ru="Обучаюсь в престижном ГАГПК, люблю HTML и CSS." 
       data-en="Studying at prestigious GAGPK, love HTML & CSS.">
       Обучаюсь в престижном ГАГПК, люблю HTML и CSS.
    </p>

    <div class="links">
      <a href="https://github.com/MrBell069" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://t.me/bred_04" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
      <a href="#" id="toggle-lang"><i class="fas fa-language"></i> English</a>
    </div>

    <div class="game">
      <h2 data-ru="Крестики-нолики" data-en="Tic-Tac-Toe">Крестики-нолики</h2>

      <label for="difficulty">Сложность:</label>
      <select id="difficulty">
        <option value="easy">Лёгкая</option>
        <option value="medium">Средняя</option>
        <option value="hard">Сложная</option>
      </select>

      <div class="board" id="board"></div>
      <p id="status"></p>
      <button onclick="restartGame()" id="restart-btn">Сыграть ещё</button>
    </div>
  </div>

  <script>
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const difficultySelect = document.getElementById("difficulty");

    let cells = [];
    let currentPlayer = "X";
    let gameActive = true;

    const winningCombos = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function createBoard() {
      boardElement.innerHTML = "";
      cells = [];
      gameActive = true;
      currentPlayer = "X";
      statusElement.textContent = "Ты играешь: X";

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.addEventListener("click", () => handleCellClick(i));
        boardElement.appendChild(cell);
        cells.push(cell);
      }
    }

    function handleCellClick(index) {
      if (!gameActive || cells[index].textContent) return;

      cells[index].textContent = currentPlayer;
      if (checkWin(currentPlayer)) {
        statusElement.textContent = `Победил: ${currentPlayer}`;
        gameActive = false;
        return;
      }
      if (isBoardFull()) {
        statusElement.textContent = "Ничья!";
        gameActive = false;
        return;
      }

      currentPlayer = "O";
      setTimeout(computerMove, 300);
    }

    function computerMove() {
      if (!gameActive) return;
      const level = difficultySelect.value;
      let move;

      if (level === "easy") {
        move = randomMove();
      } else if (level === "medium") {
        move = blockPlayer() ?? randomMove();
      } else {
        move = bestMove();
      }

      if (move !== undefined) {
        cells[move].textContent = currentPlayer;
      }

      if (checkWin(currentPlayer)) {
        statusElement.textContent = `Победил: ${currentPlayer}`;
        gameActive = false;
        return;
      }

      if (isBoardFull()) {
        statusElement.textContent = "Ничья!";
        gameActive = false;
        return;
      }

      currentPlayer = "X";
      statusElement.textContent = "Твой ход: X";
    }

    function randomMove() {
      const empty = cells
        .map((cell, i) => cell.textContent === "" ? i : null)
        .filter(i => i !== null);
      return empty[Math.floor(Math.random() * empty.length)];
    }

    function blockPlayer() {
      for (let combo of winningCombos) {
        const [a, b, c] = combo;
        const values = [cells[a].textContent, cells[b].textContent, cells[c].textContent];
        if (values.filter(v => v === "X").length === 2 && values.includes("")) {
          return combo[values.indexOf("")];
        }
      }
      return null;
    }

    function bestMove() {
      let bestScore = -Infinity;
      let move;

      for (let i = 0; i < 9; i++) {
        if (cells[i].textContent === "") {
          cells[i].textContent = "O";
          let score = minimax(0, false);
          cells[i].textContent = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }

      return move;
    }

    function minimax(depth, isMaximizing) {
      if (checkWin("O")) return 10 - depth;
      if (checkWin("X")) return depth - 10;
      if (isBoardFull()) return 0;

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (cells[i].textContent === "") {
            cells[i].textContent = "O";
            let score = minimax(depth + 1, false);
            cells[i].textContent = "";
            best = Math.max(score, best);
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (cells[i].textContent === "") {
            cells[i].textContent = "X";
            let score = minimax(depth + 1, true);
            cells[i].textContent = "";
            best = Math.min(score, best);
          }
        }
        return best;
      }
    }

    function isBoardFull() {
      return cells.every(cell => cell.textContent !== "");
    }

    function checkWin(player) {
      return winningCombos.some(combo =>
        combo.every(i => cells[i].textContent === player)
      );
    }

    function restartGame() {
      createBoard();
    }

    // Языковое переключение
    window.addEventListener('DOMContentLoaded', () => {
      createBoard();

      const toggleBtn = document.getElementById('toggle-lang');
      let currentLang = 'ru';

      toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        currentLang = currentLang === 'ru' ? 'en' : 'ru';

        document.querySelectorAll('[data-ru]').forEach(el => {
          el.textContent = el.dataset[currentLang];
        });

        toggleBtn.innerHTML = currentLang === 'ru' 
          ? '<i class="fas fa-language"></i> English' 
          : '<i class="fas fa-language"></i> Русский';
      });
    });
  </script>
</body>
</html>
