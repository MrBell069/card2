<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Визитка + Крестики-нолики</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <img src="tim.jpg" alt="Фото" class="avatar" />

    <h1 data-ru="Боровков Тимофей" data-en="Timofey Borovkov">Боровков Тимофей</h1>
    <p class="desc" data-ru="HTML вёрстка" data-en="HTML layout">HTML и CSS вёрстка</p>
    <p data-ru="Обучаюсь в престижном ГАГПК, люблю HTML и CSS." 
       data-en="Studying at prestigious GAGPK, love HTML & CSS.">
       Обучаюсь в престижном ГАГПК, люблю HTML и CSS.
    </p>

    <div class="links">
      <a href="https://github.com/MrBell069" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://t.me/bred_04" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
    </div>

    <button id="toggle-lang"><i class="fas fa-language"></i> English</button>

    <h2 data-ru="Ты играешь за: X" data-en="You play as: X">Ты играешь за: X</h2>
    <label for="difficulty" id="difficulty-label" data-ru="Сложность:" data-en="Difficulty:">Сложность:</label>
    <select id="difficulty">
      <option value="easy">Лёгкая</option>
      <option value="medium">Средняя</option>
      <option value="hard">Сложная</option>
    </select>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button id="restart-btn">Сыграть ещё</button>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const boardElement = document.getElementById('board');
    const restartBtn = document.getElementById('restart-btn');
    const difficultySelect = document.getElementById('difficulty');
    const toggleBtn = document.getElementById('toggle-lang');

    let board = Array(9).fill(null);
    let gameActive = true;
    let difficulty = 'easy';
    let currentLang = 'ru';

    const WINNING_COMBOS = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function renderBoard() {
      cells.forEach((cell, i) => {
        cell.textContent = board[i] || '';
      });
    }

    function makeMove(index, player) {
      if (board[index] || !gameActive) return;
      board[index] = player;
      renderBoard();
    }

    function checkWinner() {
      for (let combo of WINNING_COMBOS) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          gameActive = false;
          alert((currentLang === 'ru' ? 'Победил: ' : 'Winner: ') + board[a]);
          return board[a];
        }
      }
      if (!board.includes(null)) {
        gameActive = false;
        alert(currentLang === 'ru' ? 'Ничья!' : 'Draw!');
        return 'Draw';
      }
      return null;
    }

    function handleCellClick(e) {
      const idx = e.target.dataset.index;
      if (!gameActive || board[idx]) return;

      makeMove(idx, 'X');
      const result = checkWinner();
      if (result) return;

      setTimeout(aiMove, 300);
    }

    function getAvailableMoves() {
      return board.map((v, i) => v === null ? i : null).filter(v => v !== null);
    }

    function getRandomMove() {
      const available = getAvailableMoves();
      return available[Math.floor(Math.random() * available.length)];
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let move;
      for (let i of getAvailableMoves()) {
        board[i] = 'O';
        let score = minimax(board, 0, false);
        board[i] = null;
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
      return move;
    }

    function minimax(newBoard, depth, isMaximizing) {
      const result = checkWinner();
      if (result === 'O') return 10 - depth;
      if (result === 'X') return depth - 10;
      if (result === 'Draw') return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i of getAvailableMoves()) {
          newBoard[i] = 'O';
          let score = minimax(newBoard, depth + 1, false);
          newBoard[i] = null;
          bestScore = Math.max(score, bestScore);
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i of getAvailableMoves()) {
          newBoard[i] = 'X';
          let score = minimax(newBoard, depth + 1, true);
          newBoard[i] = null;
          bestScore = Math.min(score, bestScore);
        }
        return bestScore;
      }
    }

    function aiMove() {
      if (!gameActive) return;
      let move;
      if (difficulty === 'easy') move = getRandomMove();
      else if (difficulty === 'medium') {
        move = Math.random() < 0.5 ? getBestMove() : getRandomMove();
      } else move = getBestMove();

      if (move != null) {
        makeMove(move, 'O');
        checkWinner();
      }
    }

    function resetGame() {
      board = Array(9).fill(null);
      gameActive = true;
      renderBoard();
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    restartBtn.addEventListener('click', resetGame);
    difficultySelect.addEventListener('change', () => {
      difficulty = difficultySelect.value;
    });

    toggleBtn.addEventListener('click', () => {
      currentLang = currentLang === 'ru' ? 'en' : 'ru';
      document.querySelectorAll('[data-ru]').forEach(el => {
        el.textContent = el.dataset[currentLang];
      });

      toggleBtn.innerHTML = currentLang === 'ru'
        ? '<i class="fas fa-language"></i> English'
        : '<i class="fas fa-language"></i> Русский';

      document.querySelector('#difficulty-label').textContent =
        currentLang === 'ru' ? 'Сложность:' : 'Difficulty:';
    });

    renderBoard();
  </script>
</body>
</html>
