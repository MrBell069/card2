<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Визитка</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="card">
    <img src="tim.jpg" alt="Фото" class="avatar" />

    <h1 data-ru="Боровков Тимофей" data-en="Timofey Borovkov">Боровков Тимофей</h1>
    <p class="desc" data-ru="HTML и CSS вёрстка" data-en="HTML layout">HTML и CSS вёрстка</p>
    <p data-ru="Обучаюсь в престижном ГАГПК, люблю HTML и CSS." 
       data-en="Studying at prestigious GAGPK, love HTML & CSS.">
       Обучаюсь в престижном ГАГПК, люблю HTML и CSS.
    </p>

    <div class="links">
      <a href="https://github.com/MrBell069" target="_blank"><i class="fab fa-github"></i> GitHub</a>
      <a href="https://t.me/bred_04" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
      <a href="#" id="toggle-lang"><i class="fas fa-language"></i> English</a>
    </div>

    <p>Ты играешь за: X</p>
    <select id="difficulty">
      <option value="easy">Легко</option>
      <option value="medium" selected>Средне</option>
      <option value="hard">Сложно</option>
    </select>

    <div class="board" id="board"></div>
    <button id="restart-btn">Начать заново</button>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const restartBtn = document.getElementById('restart-btn');
    const difficultySelect = document.getElementById('difficulty');
    let board, currentPlayer, gameActive, difficulty;

    const WINNING_COMBOS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function initGame() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameActive = true;
      difficulty = difficultySelect.value;
      boardEl.innerHTML = '';
      board.forEach((_, idx) => {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        cell.dataset.index = idx;
        cell.addEventListener('click', handleCellClick);
        boardEl.appendChild(cell);
      });
    }

    function handleCellClick(e) {
      const idx = e.target.dataset.index;
      if (!gameActive || board[idx]) return;
      makeMove(idx, currentPlayer);
      if (!checkWinner()) {
        setTimeout(() => aiMove(), 300);
      }
    }

    function makeMove(index, player) {
      board[index] = player;
      const cell = boardEl.querySelector(`.cell[data-index="${index}"]`);
      if (cell) cell.textContent = player;
    }

    function checkWinner() {
      for (let combo of WINNING_COMBOS) {
        const [a,b,c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          gameActive = false;
          return board[a];
        }
      }
      if (!board.includes(null)) {
        gameActive = false;
        return 'Draw';
      }
      return null;
    }

    function aiMove() {
      if (!gameActive) return;

      let move;
      switch (difficulty) {
        case 'easy':
          move = getRandomMove();
          break;
        case 'medium':
          move = Math.random() < 0.5 ? getBestMove() : getRandomMove();
          break;
        case 'hard':
          move = getBestMove();
          break;
      }

      if (move != null) {
        makeMove(move, 'O');
        checkWinner();
      }
    }

    function getRandomMove() {
      const empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
      return empty[Math.floor(Math.random() * empty.length)];
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let move;
      board.forEach((cell, idx) => {
        if (!cell) {
          board[idx] = 'O';
          let score = minimax(board, 0, false);
          board[idx] = null;
          if (score > bestScore) {
            bestScore = score;
            move = idx;
          }
        }
      });
      return move;
    }

    function minimax(newBoard, depth, isMaximizing) {
      const result = checkWinner();
      if (result === 'O') return 10 - depth;
      if (result === 'X') return depth - 10;
      if (result === 'Draw') return 0;

      if (isMaximizing) {
        let best = -Infinity;
        newBoard.forEach((cell, idx) => {
          if (!cell) {
            newBoard[idx] = 'O';
            best = Math.max(best, minimax(newBoard, depth + 1, false));
            newBoard[idx] = null;
          }
        });
        return best;
      } else {
        let best = Infinity;
        newBoard.forEach((cell, idx) => {
          if (!cell) {
            newBoard[idx] = 'X';
            best = Math.min(best, minimax(newBoard, depth + 1, true));
            newBoard[idx] = null;
          }
        });
        return best;
      }
    }

    restartBtn.addEventListener('click', initGame);
    difficultySelect.addEventListener('change', () => {
      difficulty = difficultySelect.value;
      initGame();
    });

    const toggleBtn = document.getElementById('toggle-lang');
    let currentLang = 'ru';

    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      currentLang = currentLang === 'ru' ? 'en' : 'ru';

      document.querySelectorAll('[data-ru]').forEach(el => {
        el.textContent = el.dataset[currentLang];
      });

      toggleBtn.innerHTML = currentLang === 'ru' 
        ? '<i class="fas fa-language"></i> English' 
        : '<i class="fas fa-language"></i> Русский';
    });

    initGame();
  </script>
</body>
</html>
